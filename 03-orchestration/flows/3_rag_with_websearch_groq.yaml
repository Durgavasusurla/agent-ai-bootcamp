id: 3_rag_with_websearch_groq
namespace: zoomcamp

description: |
  Same as course flow 3_rag_with_websearch, but the chat model runs on Groq
  (OpenAI-compatible API) instead of OpenAI, so no OpenAI key is needed.
  Needs secrets GROQ_API_KEY and TAVILY_API_KEY.

tasks:
  - id: chat_with_rag_and_websearch_content_retriever
    type: io.kestra.plugin.ai.rag.ChatCompletion
    chatProvider:
      type: io.kestra.plugin.ai.provider.OpenAI
      baseUrl: https://api.groq.com/openai/v1
      apiKey: "{{ secret('GROQ_API_KEY') }}"
      modelName: openai/gpt-oss-120b
    contentRetrievers:
      - type: io.kestra.plugin.ai.retriever.TavilyWebSearch
        apiKey: "{{ secret('TAVILY_API_KEY') }}"
    systemMessage: You are a helpful assistant that can answer questions about Kestra.
    prompt: What is the latest release of Kestra?
