[project]
name = "agent-ai-bootcamp"
version = "0.1.0"
description = "A from-scratch AI agent (LLM + tools + RAG + memory + evals) built while following the Databricks Agent AI / LLM bootcamp."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
