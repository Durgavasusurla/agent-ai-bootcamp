[project]
name = "agent-ai-bootcamp"
version = "0.1.0"
description = "A from-scratch AI agent (LLM + tools + RAG + memory + evals) built while following the Databricks Agent AI / LLM bootcamp."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "openai>=3.37.0",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "sqlitesearch>=0.3.0",
    "streamlit>=1.65.0",
    "toyaikit>=0.0.11",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
